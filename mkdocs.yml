site_name: Documentación - Taller de Programación
site_author: "Estudiante / Grupo"
site_description: "Documentación oficial del proyecto final"
# Configuración del servidor de desarrollo 
dev_addr: '127.0.0.1:8080'
theme:
  name: material
  language: es
  palette:
    scheme: default
    primary: indigo
    accent: deep orange
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - search.suggest
    - search.highlight

nav:
  - Inicio: index.md
  - Instalación y Requisitos: instalacion.md
  - Arquitectura del Sistema: arquitectura.md
  - Guía de Uso: guia-uso.md
  - API / Módulos: api.md
  - Diagrama de Clases: diagrama.md
  - Pruebas Unitarias: pruebas.md 
  - Coclusiones: conclusiones.md

plugins:
  - search

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
